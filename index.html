<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Validator Snapshot Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b1020;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 24px;
      color: #7dd3fc;
    }

    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      border-radius: 10px;
      background: #111827;
    }

    .error {
      padding: 1rem;
      background: #1f2937;
      border-left: 4px solid #ef4444;
      border-radius: 6px;
      margin-top: 1rem;
    }

    a {
      color: #7dd3fc;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Validator Snapshot Viewer</h1>
    <div id="viewer"></div>
  </div>

  <script>
    function getSnapshotId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function loadSnapshot() {
      const id = getSnapshotId();
      const viewer = document.getElementById("viewer");

      if (!id) {
        viewer.innerHTML = `
          <div class="error">
            <strong>No snapshot ID provided.</strong><br>
            Use: <code>?id=603807</code>
          </div>`;
        return;
      }

      const htmlFile = `${id}.html`;
      const jsonFile = `${id}.json`;

      // Prefer HTML snapshot
      fetch(htmlFile)
        .then(res => {
          if (res.ok) {
            viewer.innerHTML = `<iframe src="${htmlFile}"></iframe>`;
          } else {
            // fallback to JSON viewer
            loadJsonSnapshot(jsonFile);
          }
        })
        .catch(() => loadJsonSnapshot(jsonFile));
    }

    function loadJsonSnapshot(jsonFile) {
      const viewer = document.getElementById("viewer");

      fetch(jsonFile)
        .then(res => res.json())
        .then(data => {
          viewer.innerHTML = `
            <pre style="background:#111827; padding:1rem; border-radius:8px; overflow-x:auto;">
${JSON.stringify(data, null, 2)}
            </pre>`;
        })
        .catch(() => {
          viewer.innerHTML = `
            <div class="error">
              <strong>Snapshot not found.</strong><br>
              Ensure <code>${jsonFile}</code> or <code>${jsonFile.replace(".json",".html")}</code> exists.
            </div>`;
        });
    }

    loadSnapshot();
  </script>
</body>
</html>
